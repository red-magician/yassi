<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI FES 2026 自動集計競技 受賞選定ツール（Buzz / シーンメーカー / クルーアワード）</title>
<style>
:root{
  --navy:#143058; --navy-deep:#0d2140; --navy-soft:#2a4a76;
  --gold:#FFCD00; --gold-dim:#c9a300;
  --paper:#f4f6f9; --card:#fff; --ink:#1a2233; --mute:#6b7789; --line:#dde3ec;
  --ok:#1f9d6b; --warn:#c8102e; --amber:#b26a00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Yu Gothic UI","Meiryo","Segoe UI",-apple-system,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.7}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:22px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:210px}
.brand .en{font-size:10px;letter-spacing:.16em;color:var(--gold);font-weight:700}
.brand .jp{font-size:16px;font-weight:700}
.hstat{display:flex;gap:20px;flex:1;flex-wrap:wrap}
.hstat .item{display:flex;flex-direction:column;line-height:1.3}
.hstat .k{font-size:10px;color:#9fb3cd;letter-spacing:.08em}
.hstat .v{font-size:18px;font-weight:700}
.hstat .v small{font-size:11px;font-weight:400;color:#9fb3cd}
.hstat .v.warn{color:#ff9aa6}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:10px;color:#9fb3cd;letter-spacing:.08em}
.fld input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 9px;border-radius:4px;font:inherit;font-size:13px;width:130px}
.fld input::placeholder{color:#9fb3cd}
.tabs{background:var(--navy-deep);padding:0 22px;display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:none;color:#9fb3cd;font:inherit;font-size:13px;font-weight:700;padding:11px 18px;cursor:pointer;border-bottom:3px solid transparent}
.tab:hover{color:#e7edf5}
.tab.on{color:#fff;border-bottom-color:var(--gold)}
.tab small{display:block;font-size:10px;font-weight:400;color:#8ba0bd}
.toolbar{background:#1b355f;padding:9px 22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid transparent;padding:7px 13px;transition:.15s}
.btn{background:rgba(255,255,255,.09);color:#e7edf5;border-color:rgba(255,255,255,.22)}
.btn:hover{background:rgba(255,255,255,.18)}
.btn-gold{background:var(--gold);color:var(--navy-deep);font-weight:700}
.btn-gold:hover{background:#ffd93a}
.sep{width:1px;height:22px;background:rgba(255,255,255,.2);margin:0 5px}
.hint{margin-left:auto;font-size:11px;color:#9fb3cd;max-width:360px}
main{padding:22px 26px;max-width:1400px;margin:0 auto}
.drop{border:2px dashed #c3cfdd;border-radius:10px;background:#fff;padding:30px;text-align:center;color:var(--mute);margin-bottom:16px;transition:.15s;cursor:pointer}
.drop.on{border-color:var(--gold);background:#fffdf3}
.drop b{display:block;font-size:15px;color:var(--navy);margin-bottom:5px}
.drop span{font-size:12px}
.pastdrop{border:1.5px dashed #c3cfdd;border-radius:8px;background:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer;font-size:12px;color:var(--mute)}
.pastdrop.on{border-color:var(--gold);background:#fffdf3}
.pastdrop b{color:var(--navy);font-weight:700;font-size:13px;flex-shrink:0}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fchip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:6px;padding:7px 11px;font-size:11.5px}
.fchip b{color:var(--navy)}
.fchip .cnt{color:var(--mute)}
.fchip button{background:none;border:none;color:var(--mute);padding:0 2px;font-size:15px;line-height:1}
.fchip button:hover{color:var(--warn)}
.warnbar{background:#fff8e8;border:1px solid #f0dfa0;border-left:4px solid var(--amber);border-radius:6px;padding:10px 14px;font-size:12.5px;color:#7a5b00;margin-bottom:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:20px}
.panel h2{font-size:11px;letter-spacing:.14em;color:var(--navy);font-weight:700;padding:13px 18px;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel h2 span{margin-left:auto;font-size:11px;letter-spacing:0;color:var(--mute);font-weight:400}
.empty{padding:36px;text-align:center;color:var(--mute);font-size:13px}
.award-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding:16px 18px}
.acard{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fbfcfe;display:flex;flex-direction:column}
.acard.empty2{align-items:center;justify-content:center;color:var(--mute);font-size:12px;min-height:110px}
.ahead{background:var(--navy);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px}
.ahead .rk{background:var(--gold);color:var(--navy-deep);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.ahead select{margin-left:auto;font-size:12px;padding:4px 7px;border-radius:4px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;max-width:220px}
.ahead select option{color:#000}
.abody{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ainfo b{display:block;font-size:13px;color:var(--navy-deep)}
.ainfo span{font-size:11px;color:var(--mute)}
.ascore{display:flex;gap:10px;font-size:11px;color:var(--mute);flex-wrap:wrap}
.ascore b{color:var(--navy);font-size:13px}
.acard textarea{width:100%;font:inherit;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:5px;resize:vertical;min-height:38px}
.acard textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.acard label{font-size:10.5px;color:var(--mute);font-weight:600}
.toolrow{display:flex;gap:6px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{font-size:11px;padding:4px 11px;border:1px solid var(--line);background:#fff;color:var(--mute);border-radius:99px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.table-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{background:var(--navy);color:#fff;font-size:11px;font-weight:600;padding:9px 8px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:3}
thead th.n{text-align:center}
tbody td{padding:8px;border-bottom:1px solid #eef1f6;vertical-align:middle}
tbody tr:hover{background:#f7f9fc}
tbody tr.excluded{opacity:.5}
tbody tr.awarded{background:#fffbea}
td.n{text-align:center}
td.who b{display:block;color:var(--navy-deep)}
td.who span{font-size:10.5px;color:var(--mute)}
.val{font-weight:700;color:var(--navy);font-size:15px}
.likepill{background:#fdf0f2;color:#a3183a;border:1px solid #f3c6d1;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap;display:inline-block}
.badge.win{background:#fffbea;color:#8a6d00;border-color:#f0dfa0}
.badge.excl{background:#fdf0f2;color:var(--warn);border-color:#f0c2c9}
.legend{display:flex;gap:16px;padding:11px 18px;background:#f8fafc;border-top:1px solid var(--line);font-size:11px;color:var(--mute);flex-wrap:wrap}
.legend b{color:var(--ink)}
/* crew merge */
.merge-help{padding:11px 18px;font-size:12px;color:var(--mute);background:#f8fafc;border-bottom:1px solid var(--line);line-height:1.7}
.merge-help b{color:var(--ink)}
.merge-tbl td{padding:7px 8px}
.merge-tbl input[type=text]{width:100%;max-width:220px;font:inherit;font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:5px}
.merge-tbl input[type=text]:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.merge-tbl input[type=checkbox]{width:15px;height:15px;cursor:pointer}
.rawname{font-weight:600;color:var(--navy-deep)}
.rawname.multi{color:var(--amber)}
tr.invalid{opacity:.45}
.rk-sel{font-size:12px;padding:5px 6px;border-radius:4px;border:1px solid var(--line);background:#fff}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy-deep);color:#fff;padding:11px 22px;border-radius:6px;font-size:13px;box-shadow:0 8px 24px rgba(13,33,64,.3);z-index:200;opacity:0;transition:.25s;border-left:3px solid var(--gold)}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.modal{position:fixed;inset:0;background:rgba(13,33,64,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:10px;max-width:640px;width:100%;max-height:80vh;overflow:auto;padding:26px 28px}
.mbox h3{font-size:16px;color:var(--navy-deep);margin-bottom:4px}
.mbox .sub{font-size:12px;color:var(--mute);margin-bottom:16px}
.issue{padding:10px 13px;border-radius:5px;margin-bottom:8px;font-size:13px;display:flex;gap:9px;align-items:flex-start}
.issue.err{background:#fdf0f2;border-left:3px solid var(--warn)}
.issue.warn{background:#fff8e8;border-left:3px solid var(--amber)}
.issue.ok{background:#eefaf4;border-left:3px solid var(--ok)}
.issue b{flex-shrink:0}
.mbox .close{margin-top:16px;background:var(--navy);color:#fff;width:100%;padding:10px;font-weight:600;border:none}
@media print{ .tabs,.toolbar,.drop,.pastdrop,.files,header .btn{display:none !important} thead th{position:static} main{padding:0} table{font-size:9px} }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="en">AI FES 2026 / AUTO-TALLY</span>
    <span class="jp" id="brandJp">自動集計競技 受賞選定ツール</span>
  </div>
  <div class="hstat">
    <div class="item"><span class="k" id="k1">対象</span><span class="v" id="hPeople">0<small> 名</small></span></div>
    <div class="item"><span class="k">受賞候補</span><span class="v" id="hAwards">0<small> / 6</small></span></div>
    <div class="item"><span class="k">受賞済み（同競技）除外</span><span class="v" id="hExcl">0<small> 名</small></span></div>
    <div class="item" id="hMergeWrap" style="display:none"><span class="k">未処理の生名</span><span class="v" id="hMerge">0<small> 件</small></span></div>
  </div>
  <div class="fld"><label>作業者名</label><input type="text" id="staffName" placeholder="例）城間"></div>
  <div class="fld"><label>期・回</label><input type="text" id="period" placeholder="例）最終"></div>
</header>

<div class="tabs" id="tabs">
  <button class="tab on" data-comp="buzz">Buzzステージ<small>被いいね数の合計</small></button>
  <button class="tab" data-comp="scene">シーンメーカー<small>通期累計いいね</small></button>
  <button class="tab" data-comp="crew">クルーアワード<small>支援名の記載数</small></button>
</div>

<div class="toolbar">
  <button class="btn" id="btnLoad">マスターExcelを読み込む</button>
  <input type="file" id="fileMaster" accept=".xlsx,.xlsm" hidden>
  <span class="sep"></span>
  <button class="btn" id="btnLoadPast">過去の受賞者Excelを追加</button>
  <input type="file" id="filePast" accept=".xlsx,.xlsm" multiple hidden>
  <span class="sep"></span>
  <button class="btn" id="btnCheck">入力チェック</button>
  <button class="btn-gold" id="btnXLS">Excelを書き出して提出</button>
  <button class="btn" id="btnPrint">印刷 / PDF</button>
  <button class="btn" id="btnClear">この競技の入力を消去</button>
  <span class="hint" id="topHint"></span>
</div>

<main>
  <div class="drop" id="drop">
    <b>ここにマスターExcelをドロップ</b>
    <span>クリックして選択も可。01_EntryINDEX ＋ 03_いいね集計 を含む集計マスターを読み込みます。競技はタブで切り替えます。</span>
  </div>
  <div class="pastdrop" id="pastDrop">
    <b>過去の受賞者Excel</b>
    <span id="pastHint">同じ競技で先に書き出した「受賞一覧」をドロップすると、その受賞者を今回の対象から除外します（Buzzの中間→最終など）。競技をまたいだ除外はしません。</span>
  </div>
  <div class="files" id="pastFiles"></div>
  <div id="out"></div>
</main>

<div class="toast" id="toast"></div>
<div class="modal" id="checkModal"><div class="mbox">
  <h3>入力チェック</h3><div class="sub">書き出し前に確認してください。</div>
  <div id="checkBody"></div>
  <button class="close" id="checkClose">閉じる</button>
</div></div>

<script>__SHEETJS__</script>
<script>
const AWARD_SLOTS = 6;
const STORE_PREFIX = 'aiFesAutoTally_v1::';
const COMP_META = {
  buzz:  {jp:'Buzzステージ', valLabel:'累計いいね', unit:'名', persona:'先駆者として情報発信し続ける人',
          hint:'buzz投稿の被いいねを人ごとに合計し、上位6名が受賞候補になります。中間受賞者は過去の受賞者Excelを読み込んで最終から除外します。'},
  scene: {jp:'シーンメーカー', valLabel:'通期累計いいね', unit:'名', persona:'半年間継続発信し続けたアンバサダー・先駆者',
          hint:'IsSceneEligible の人の、全競技横断の通期累計いいねで順位付けします。対象が6名未満なら該当者のみが受賞候補になります。'},
  crew:  {jp:'クルーアワード', valLabel:'記載数', unit:'名', persona:'他者を支援した結果、名前を書いてもらえる人',
          hint:'支援アンバサダー名の記載数で順位付けします。表記ゆれや複数名は下の名寄せパネルでまとめてから集計してください。'},
};

let COMP = 'buzz';
let ENTRIES01 = [];        // {code, comp, period, name, dept, pkey, buzzElig, sceneElig, amb, target}
let LIKES = {};            // EntryCode -> likes (from 03_いいね集計)
let PEOPLE = [];           // 現在の競技の集計結果（recomputeで生成）
// 競技×期ごとに保持する状態
let staffName = '', period = '';
let stateByComp = {};      // comp -> {pinned, pinnedOut, notes, pastFiles, crewCanon, crewInvalid}
function S(){ return stateByComp[COMP] || (stateByComp[COMP] = {pinned:{}, pinnedOut:{}, notes:{}, pastFiles:[], crewCanon:{}, crewInvalid:{}}); }
let ranks = {};            // pkey -> 1..6（recompute/autoRankが算出）

/* ---------- utils ---------- */
function esc(s){ return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(x){ const n=Number(x); return (x===''||x==null||isNaN(n))?0:n; }
function truthy(x){ const s=String(x).trim().toLowerCase(); return s==='true'||s==='1'||s==='yes'||s==='はい'; }
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
let tt; function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),3400); }
function surnameOf(who){ return (who||'').split(/[\/／]/)[0].trim(); }
function splitNames(raw){
  if(!raw) return [];
  return String(raw).split(/[\n\r,、\/／;；]+/).map(s=>s.trim()).filter(Boolean);
}

/* ---------- Excel 読み込み ---------- */
function sheetRows(wb, name){ return XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:false, defval:''}); }
function pickSheet(wb, mustHave, nameHint){
  let best=null;
  for(const name of wb.SheetNames){
    const rows = sheetRows(wb, name); if(!rows.length) continue;
    const head = rows[0].map(x=>String(x).trim());
    if(!mustHave.every(h=>head.includes(h))) continue;
    const hit = {name, rows, head};
    if(nameHint && name.includes(nameHint)) return hit;
    if(!best) best = hit;
  }
  return best;
}
function idxer(head){ return n => head.indexOf(n); }
function loadMasterFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      const idxSheet = pickSheet(wb, ['EntryCode','CompetitionKey','SubmitterDisplayName'], 'EntryINDEX');
      if(!idxSheet){ toast(`${file.name}：01_EntryINDEX 相当のシートが見つかりません`); return; }
      const h = idxSheet.head, c = idxer(h);
      const col = {
        code:c('EntryCode'), comp:c('CompetitionKey'), period:c('PeriodKey'),
        name:c('SubmitterDisplayName'), email:c('SubmitterEmail'), entra:c('SubmitterEntraId'),
        dept:c('Department'), buzz:c('IsBuzzEligible'), scene:c('IsSceneEligible'),
        amb:c('SupportAmbassadorNames'), target:c('審査対象フラグ'),
      };
      ENTRIES01 = idxSheet.rows.slice(1).map(r=>{
        const g = k => col[k]>=0 ? String(r[col[k]]??'').trim() : '';
        const name = g('name'), dept = g('dept');
        const entra = g('entra'), email = g('email').toLowerCase();
        return {
          code:g('code'), comp:g('comp').toLowerCase(), period:g('period'),
          name, dept, who: dept? `${name}/${dept}` : name,
          pkey: entra || email || name,
          buzzElig:g('buzz'), sceneElig:g('scene'), amb:g('amb'),
          target: col.target<0 ? true : truthy(g('target')) || g('target')==='',
        };
      }).filter(e=>e.code);

      // いいね集計（EntryCode -> LikesReceived）
      LIKES = {};
      const likeSheet = pickSheet(wb, ['EntryCode','LikesReceived（もらう）'], 'いいね');
      if(likeSheet){
        const lh=likeSheet.head, lc=idxer(lh);
        const iCode=lc('EntryCode'), iLr=lc('LikesReceived（もらう）');
        likeSheet.rows.slice(1).forEach(r=>{ const code=String(r[iCode]??'').trim(); if(code) LIKES[code]=num(r[iLr]); });
      }
      // 04_受賞者マスタ（内蔵の過去受賞者）
      MASTER_AWARDS = readMasterAwards(wb);

      recompute(); render();
      const likeNote = likeSheet ? '' : '（いいね列が見つからないため、いいね系の集計は0になります）';
      toast(`読み込み：${ENTRIES01.length}エントリー${likeNote}`);
    }catch(err){ toast(`${file.name} を開けませんでした`); }
  };
  rd.readAsArrayBuffer(file);
}
let MASTER_AWARDS = [];   // {name, comp}
function readMasterAwards(wb){
  const s = pickSheet(wb, ['受賞者（本人）','CompetitionKey'], '受賞者マスタ');
  if(!s) return [];
  const c=idxer(s.head), iName=c('受賞者（本人）'), iComp=c('CompetitionKey');
  return s.rows.slice(1).map(r=>({name:String(r[iName]??'').trim(), comp:String(r[iComp]??'').trim().toLowerCase()}))
    .filter(x=>x.name);
}
function loadPastFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      const s = pickSheet(wb, ['受賞順位'], null) || pickSheet(wb, ['受賞一覧'], null);
      let sheet=null;
      for(const name of wb.SheetNames){ const rows=sheetRows(wb,name); if(rows.length){ const head=rows[0].map(x=>String(x).trim()); if(head.includes('氏名・部署')||head.includes('応募者・部署')){ sheet={name,rows,head}; break; } } }
      if(!sheet){ toast(`${file.name}：受賞一覧シートが見つかりません`); return; }
      const c=idxer(sheet.head);
      const iWho = sheet.head.includes('氏名・部署')?c('氏名・部署'):c('応募者・部署');
      const iComp = c('競技'); const iPeriod=c('期（中間・最終）')>=0?c('期（中間・最終）'):c('対象月');
      const names=new Set(); let label='';
      sheet.rows.slice(1).forEach(r=>{ const who=String(r[iWho]??'').trim(); if(!who) return; names.add(surnameOf(who)); if(iPeriod>=0&&r[iPeriod]) label=String(r[iPeriod]).trim(); });
      if(!names.size){ toast(`${file.name}：受賞者が見つかりません`); return; }
      const st=S(); st.pastFiles = st.pastFiles.filter(p=>p.name!==file.name);
      st.pastFiles.push({name:file.name, label:label||file.name, names:[...names]});
      recompute(); render(); toast(`${file.name}：${names.size}名を除外に追加`);
    }catch(err){ toast(`${file.name} を開けませんでした`); }
  };
  rd.readAsArrayBuffer(file);
}
function excludedMap(){
  // このタブの競技に限定した過去受賞者（氏名 -> ラベル）
  const m = new Map();
  S().pastFiles.forEach(p=>p.names.forEach(n=>{ if(!m.has(n)) m.set(n, p.label); }));
  MASTER_AWARDS.filter(a=>a.comp===COMP).forEach(a=>{ const n=surnameOf(a.name); if(!m.has(n)) m.set(n,'04_受賞者マスタ'); });
  return m;
}

/* ---------- 集計 ---------- */
function recompute(){
  const excl = excludedMap();
  const people = {};
  const add = (key, name, dept) => people[key] || (people[key] = {key, name, dept, who: dept?`${name}/${dept}`:name, likes:0, count:0, posts:0, comps:new Set(), depts:new Set(), raws:new Set()});
  if(COMP==='buzz'){
    ENTRIES01.filter(e=>e.comp==='buzz' && truthy(e.buzzElig) && e.target).forEach(e=>{
      const p=add(e.pkey, e.name, e.dept); p.likes += (LIKES[e.code]||0); p.posts++; p.comps.add('buzz');
    });
    PEOPLE = finalize(people, 'likes');
  }else if(COMP==='scene'){
    const sceneKeys = new Set(ENTRIES01.filter(e=>truthy(e.sceneElig)).map(e=>e.pkey));
    ENTRIES01.filter(e=>sceneKeys.has(e.pkey)).forEach(e=>{
      const p=add(e.pkey, e.name, e.dept); p.likes += (LIKES[e.code]||0); p.posts++; p.comps.add(e.comp);
    });
    PEOPLE = finalize(people, 'likes');
  }else{ // crew
    const st=S();
    ENTRIES01.forEach(e=>{
      splitNames(e.amb).forEach(raw=>{
        if(st.crewInvalid[raw]) return;
        const canon = (st.crewCanon[raw]||'').trim() || raw;
        const p=add(canon, canon, ''); p.count++; p.comps.add(e.comp); if(e.dept) p.depts.add(e.dept); p.raws.add(raw);
      });
    });
    PEOPLE = finalize(people, 'count');
  }
  autoRank();
}
function finalize(people, valKey){
  const arr = Object.values(people).map(p=>{
    p.value = p[valKey];
    p.avg = p.posts ? Math.round(p.likes/p.posts*10)/10 : 0;
    p.excluded = excludedMap().has(surnameOf(p.name));
    return p;
  });
  arr.sort((a,b)=>{
    if(b.value!==a.value) return b.value-a.value;
    if(COMP==='crew'){ if(b.comps.size!==a.comps.size) return b.comps.size-a.comps.size; return b.depts.size-a.depts.size; }
    if(b.avg!==a.avg) return b.avg-a.avg;
    return b.posts-a.posts;
  });
  return arr;
}

/* ---------- ランキング（固定＋自動補充） ---------- */
function eligibleSorted(){ return PEOPLE.filter(p=>!p.excluded && p.value>0); }
function autoRank(){
  const st=S(), pinned=st.pinned, pinnedOut=st.pinnedOut;
  const valid = new Set(PEOPLE.filter(p=>!p.excluded).map(p=>p.key));
  Object.keys(pinned).forEach(k=>{ if(!valid.has(k)) delete pinned[k]; });
  ranks = {}; const used=new Set();
  Object.keys(pinned).sort((a,b)=>pinned[a]-pinned[b]).forEach(k=>{ const s=pinned[k]; if(!used.has(s)){ ranks[k]=s; used.add(s); } });
  const placed=new Set(Object.keys(ranks));
  const cand = eligibleSorted().filter(p=>!placed.has(p.key) && !pinnedOut[p.key]);
  for(let slot=1;slot<=AWARD_SLOTS;slot++){ if(used.has(slot)) continue; const nx=cand.shift(); if(!nx) break; ranks[nx.key]=slot; used.add(slot); }
}
function rankOf(key){ return ranks[key]||0; }
function slotPerson(slot){ const k=Object.keys(ranks).find(x=>ranks[x]===slot); return k?PEOPLE.find(p=>p.key===k):null; }
function setRank(key, slot){
  const st=S();
  if(slot===0){ delete st.pinned[key]; st.pinnedOut[key]=true; }
  else{ Object.keys(st.pinned).forEach(k=>{ if(st.pinned[k]===slot&&k!==key) delete st.pinned[k]; }); st.pinned[key]=slot; delete st.pinnedOut[key]; }
  autoRank(); render(); saveState();
}
function pinSlot(slot, key){
  const st=S();
  Object.keys(st.pinned).forEach(k=>{ if(st.pinned[k]===slot) delete st.pinned[k]; });
  if(key){ st.pinned[key]=slot; delete st.pinnedOut[key]; }
  autoRank(); render(); saveState();
}

function stateKey(){ return STORE_PREFIX + (staffName||'__anon__') + '::' + COMP + '::' + (period||'__def__'); }

    pastFiles: st.pastFiles.map(p=>({name:p.name,label:p.label,names:p.names})) };

}
function loadState(){
  const st = stateByComp[COMP] = {pinned:{}, pinnedOut:{}, notes:{}, pastFiles:[], crewCanon:{}, crewInvalid:{}};
  try{
    const raw = localStorage.getItem(stateKey()); if(!raw) return;
    const d = JSON.parse(raw);
    if(d.pinned) st.pinned=d.pinned; if(d.pinnedOut) st.pinnedOut=d.pinnedOut;
    if(d.notes) st.notes=d.notes; if(d.crewCanon) st.crewCanon=d.crewCanon; if(d.crewInvalid) st.crewInvalid=d.crewInvalid;
    if(d.pastFiles) st.pastFiles=d.pastFiles.map(p=>({name:p.name,label:p.label,names:p.names}));

    if(untouched.length) issues.push({t:'warn',m:`名寄せ未処理の生名が${untouched.length}件あります（そのまま集計されています。表記ゆれが無ければOK）`});

document.getElementById('fileMaster').onchange=e=>{ if(e.target.files[0]) loadMasterFile(e.target.files[0]); e.target.value=''; };
const pastDrop=document.getElementById('pastDrop');
pastDrop.onclick=()=>document.getElementById('filePast').click();
pastDrop.ondragover=e=>{ e.preventDefault(); pastDrop.classList.add('on'); };
pastDrop.ondragleave=()=>pastDrop.classList.remove('on');
pastDrop.ondrop=e=>{ e.preventDefault(); pastDrop.classList.remove('on'); [...e.dataTransfer.files].forEach(loadPastFile); };
document.getElementById('btnLoadPast').onclick=()=>document.getElementById('filePast').click();
document.getElementById('filePast').onchange=e=>{ [...e.target.files].forEach(loadPastFile); e.target.value=''; };
document.getElementById('btnCheck').onclick=runCheck;
document.getElementById('checkClose').onclick=()=>document.getElementById('checkModal').classList.remove('on');
document.getElementById('btnXLS').onclick=exportXLSX;
document.getElementById('btnPrint').onclick=()=>window.print();
document.getElementById('btnClear').onclick=()=>{ if(confirm(`${COMP_META[COMP].jp}のこの期の入力（順位固定・名寄せ・備考・除外）を消します。よろしいですか？`)){ stateByComp[COMP]={pinned:{},pinnedOut:{},notes:{},pastFiles:[],crewCanon:{},crewInvalid:{}}; recompute(); saveState(); render(); toast('この競技の入力を消去しました'); } };
loadState(); render();
</script>
