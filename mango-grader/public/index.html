<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e8571f" />
<title data-i18n="meta.title">マンゴー等級判定（試作）</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/icon-180.png" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>
<header class="app-header">
  <h1 data-i18n="header.title">🥭 マンゴー等級判定</h1>
  <div class="header-right">
    <span class="badge-experimental" data-i18n="header.badge">試作 v1</span>
    <select id="lang-select" class="lang-select" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </div>
</header>

<main>
  <section id="screen-home" class="screen">
    <details class="caveat-box" open>
      <summary data-i18n="home.caveat.summary">⚠ 判定精度についての注意（必読）</summary>
      <ul>
        <li data-i18n="home.caveat.item1"></li>
        <li data-i18n="home.caveat.item2"></li>
        <li data-i18n="home.caveat.item3"></li>
        <li data-i18n="home.caveat.item4"></li>
        <li data-i18n="home.caveat.item5"></li>
      </ul>
    </details>

    <p class="lead" data-i18n="home.lead">無彩色の背景の上に果実を1個だけ置いて撮影してください。</p>

    <div class="capture-buttons">
      <label class="btn btn-primary">
        <span data-i18n="home.captureCamera">📷 写真を撮る</span>
        <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
      </label>
      <label class="btn btn-secondary">
        <span data-i18n="home.captureGallery">🖼 アルバムから選ぶ</span>
        <input id="gallery-input" type="file" accept="image/*" hidden />
      </label>
    </div>

    <div class="settings-box">
      <label class="switch-row">
        <input id="send-logs-toggle" type="checkbox" />
        <span data-i18n="home.sendLogsLabel">判定結果をモデル改善のために送信する（画像は送信されません。数値と等級のみ）</span>
      </label>
      <p class="threshold-status"><span data-i18n="home.thresholdStatusPrefix">現在の判定基準: </span><span id="threshold-status-text">-</span></p>
      <button id="open-calibrate-btn" class="btn btn-link" data-i18n="home.openCalibrate">⚙ 較正モード（スタッフ向け）</button>
    </div>
  </section>

  <section id="screen-calibrate" class="screen hidden">
    <h2 data-i18n="calibrate.title">撮影環境向けの較正</h2>
    <p class="lead" data-i18n="calibrate.lead"></p>

    <div id="calibrate-list" class="calibrate-list"></div>

    <label class="btn btn-secondary">
      <span data-i18n="calibrate.addPhotos">＋ サンプル写真を追加</span>
      <input id="calibrate-input" type="file" accept="image/*" multiple hidden />
    </label>

    <div id="calibrate-progress" class="calibrate-progress hidden">
      <div class="spinner"></div>
      <p id="calibrate-progress-text" data-i18n="calibrate.progressDefault">計算中…</p>
    </div>

    <div id="calibrate-result" class="calibrate-result hidden"></div>

    <div class="action-row">
      <button id="calibrate-back-btn" class="btn btn-secondary" data-i18n="calibrate.back">戻る</button>
      <button id="calibrate-run-btn" class="btn btn-primary" disabled data-i18n="calibrate.run">較正を実行</button>
    </div>
    <button id="calibrate-reset-btn" class="btn btn-link" data-i18n="calibrate.reset">既定の設定に戻す</button>
  </section>

  <section id="screen-loading" class="screen hidden">
    <div class="spinner"></div>
    <p data-i18n="loading.text">判定中…</p>
  </section>

  <section id="screen-result" class="screen hidden">
    <img id="result-preview" class="preview-img" data-i18n-attr="alt:result.previewAlt" alt="撮影した写真" />
    <div class="result-card">
      <div id="grade-badge" class="grade-badge">?</div>
      <div id="grade-label" class="grade-label"></div>
      <p class="confidence-row"><span data-i18n="result.confidencePrefix">確信度: </span><span id="confidence-value">-</span></p>
      <p id="needs-review-banner" class="needs-review hidden"></p>
      <p id="result-note" class="result-note hidden"></p>
      <details class="feature-box">
        <summary data-i18n="result.detailsSummary">詳細を見る</summary>
        <dl id="feature-details"></dl>
      </details>
    </div>
    <div class="action-row">
      <button id="wrong-btn" class="btn btn-secondary" data-i18n="result.wrong">この判定は違う</button>
      <button id="retake-btn" class="btn btn-primary" data-i18n="result.retake">もう一度撮る</button>
    </div>
  </section>

  <section id="screen-correct" class="screen hidden">
    <h2 data-i18n="correct.title">正しい等級を選んでください</h2>
    <form id="correct-form">
      <div class="radio-row">
        <label><input type="radio" name="human_grade" value="A" required /> <span data-i18n="grade.A">A（赤秀）</span></label>
        <label><input type="radio" name="human_grade" value="B" /> <span data-i18n="grade.B">B（黒秀）</span></label>
        <label><input type="radio" name="human_grade" value="C" /> <span data-i18n="grade.C">C（白箱）</span></label>
      </div>
      <label class="switch-row">
        <input id="has-defect" type="checkbox" />
        <span data-i18n="correct.hasDefect">傷・ヤニなど色以外の理由で等級が下がっている</span>
      </label>
      <div class="action-row">
        <button type="button" id="correct-cancel-btn" class="btn btn-secondary" data-i18n="correct.cancel">キャンセル</button>
        <button type="submit" class="btn btn-primary" data-i18n="correct.submit">送信</button>
      </div>
    </form>
  </section>
</main>

<footer class="app-footer">
  <p data-i18n="footer.text">色（表面等級）のみの試作判定です。最終等級は人の目で確認してください。</p>
</footer>

<script type="module" src="./js/app.js"></script>
</body>
</html>
